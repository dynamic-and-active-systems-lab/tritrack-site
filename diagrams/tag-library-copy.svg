<polyline fill="none" stroke="black" points="227,-122 221,-122 "/>
<text text-anchor="start" x="35" y="-109.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">A copy is a separate row from the</text>
<text text-anchor="start" x="35" y="-97.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">moment it&#39;s made. Editing the library</text>
<text text-anchor="start" x="35" y="-85.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">never reaches a project&#39;s copy on its</text>
<text text-anchor="start" x="35" y="-73.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">own — &quot;Apply this to your projects?&quot;</text>
<text text-anchor="start" x="35" y="-61.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">after a library edit is asked every</text>
<text text-anchor="start" x="35" y="-49.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">time, and only an owner can accept it</text>
<text text-anchor="start" x="35" y="-37.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">for their project. Editing a project&#39;s</text>
<text text-anchor="start" x="35" y="-25.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">copy never reaches the library or any</text>
<text text-anchor="start" x="35" y="-13.2" font-family="Helvetica,Arial,sans-serif" font-size="11.00">other project either way.</text>
</g>
