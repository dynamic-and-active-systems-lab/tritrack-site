<text text-anchor="start" x="20.5" y="-503.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00">Server: the countdown</text>
<text text-anchor="start" x="20.5" y="-489.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00">✓ records kept until the date</text>
<text text-anchor="start" x="20.5" y="-475.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00"> &#160;&#160;(30 days by default); every</text>
<text text-anchor="start" x="20.5" y="-461.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00"> &#160;&#160;member sees it and can export;</text>
<text text-anchor="start" x="20.5" y="-447.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00"> &#160;&#160;the owner can cancel</text>
</g>
