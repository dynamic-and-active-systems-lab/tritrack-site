<path fill="none" stroke="black" d="M222,-604C222,-604 18,-604 18,-604 12,-604 6,-598 6,-592 6,-592 6,-560 6,-560 6,-554 12,-548 18,-548 18,-548 222,-548 222,-548 228,-548 234,-554 234,-560 234,-560 234,-592 234,-592 234,-598 228,-604 222,-604"/>
<text text-anchor="start" x="19" y="-586.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00">On a published project, the owner</text>
<text text-anchor="start" x="19" y="-572.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00">taps Delete permanently…, then</text>
<text text-anchor="start" x="19" y="-558.6" font-family="Helvetica,Arial,sans-serif" font-size="13.00">Schedule delete</text>
</g>
